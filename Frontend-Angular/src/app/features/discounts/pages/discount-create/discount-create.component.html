<div class="container">
  <h1 class="title">Create Discount</h1>

  <div class="form-container">
    <form (ngSubmit)="onSubmit()">
      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Title</mat-label>
        <input
          matInput
          [(ngModel)]="title"
          name="title"
          [disabled]="isSubmitting"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Percentage</mat-label>
        <input
          matInput
          type="number"
          min="0"
          max="100"
          [(ngModel)]="percentage"
          name="percentage"
          [disabled]="isSubmitting"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Start Date</mat-label>
        <input
          matInput
          type="datetime-local"
          [(ngModel)]="startDate"
          name="startDate"
          [disabled]="isSubmitting"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>End Date</mat-label>
        <input
          matInput
          type="datetime-local"
          [(ngModel)]="endDate"
          name="endDate"
          [disabled]="isSubmitting"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Product (optional)</mat-label>
        <input
          matInput
          type="text"
          [formControl]="productControl"
          [matAutocomplete]="productAuto"
          placeholder="Search product"
          [disabled]="isSubmitting"
        />
        <mat-autocomplete
          #productAuto="matAutocomplete"
          [displayWith]="displayProduct"
          (optionSelected)="onProductSelected($event.option.value)"
        >
          <mat-option *ngFor="let product of filteredProducts" [value]="product">
            {{ product.name }}
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Category (optional)</mat-label>
        <mat-select [(ngModel)]="categoryId" name="categoryId" [disabled]="isSubmitting">
          <mat-option [value]="null">None</mat-option>
          <mat-option *ngFor="let category of categories" [value]="category.id">
            {{ category.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <div class="actions">
        <button
          type="button"
          mat-stroked-button
          (click)="onCancel()"
          [disabled]="isSubmitting"
        >
          Cancel
        </button>
        <button
          type="submit"
          mat-raised-button
          color="primary"
          [disabled]="isSubmitting"
        >
          {{ isSubmitting ? 'Creating...' : 'Create' }}
        </button>
      </div>
    </form>
  </div>
</div>
