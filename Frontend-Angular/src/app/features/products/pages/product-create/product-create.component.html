<div class="container">
  <div #formTop></div>
  <h1 class="title">Create Product</h1>

  <div class="form-container">
    <form (ngSubmit)="onSubmit()">
      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Name</mat-label>
        <input
          matInput
          [(ngModel)]="name"
          name="name"
          [disabled]="isSubmitting"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Price</mat-label>
        <input
          matInput
          type="number"
          min="0"
          step="0.01"
          [(ngModel)]="price"
          name="price"
          [disabled]="isSubmitting"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Description</mat-label>
        <textarea
          matInput
          rows="4"
          [(ngModel)]="description"
          name="description"
          [disabled]="isSubmitting"
        ></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Stock Quantity</mat-label>
        <input
          matInput
          type="number"
          min="0"
          [(ngModel)]="stockQuantity"
          name="stockQuantity"
          [disabled]="isSubmitting"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Category</mat-label>
        <mat-select [(ngModel)]="categoryId" name="categoryId" [disabled]="isSubmitting">
          <mat-option [value]="null">Select a category</mat-option>
          <mat-option *ngFor="let category of categories" [value]="category.id">
            {{ category.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <div class="gallery-section">
        <div class="section-title">Image Gallery</div>

        <div *ngIf="imageGallery.length > 0; else noImages" class="gallery-grid">
          <button
            type="button"
            class="gallery-item"
            *ngFor="let image of imageGallery"
            [class.selected]="isSelectedImage(image)"
            (click)="selectImage(image)"
            [disabled]="isSubmitting"
          >
            <img [src]="imageUrl(image)" [alt]="image" />
          </button>
        </div>

        <ng-template #noImages>
          <div class="empty-state">No images available.</div>
        </ng-template>

        <div *ngIf="imagePath" class="selected-preview">
          <div class="preview-label">Selected image</div>
          <div class="selected-preview-image">
            <img [src]="imageUrl(imagePath)" [alt]="imagePath" />
          </div>
        </div>
      </div>

      <div class="toggle-row">
        <label>
          <input type="checkbox" [(ngModel)]="isPublished" name="isPublished" [disabled]="isSubmitting" />
          Published
        </label>
      </div>

      <div class="actions">
        <button
          type="button"
          mat-stroked-button
          (click)="onCancel()"
          [disabled]="isSubmitting"
        >
          Cancel
        </button>
        <button
          type="submit"
          mat-raised-button
          color="primary"
          [disabled]="isSubmitting"
        >
          {{ isSubmitting ? 'Creating...' : 'Create' }}
        </button>
      </div>
    </form>
  </div>
</div>
