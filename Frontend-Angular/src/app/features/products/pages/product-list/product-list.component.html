<div class="container">
  <h1>Products</h1>

  <!-- Filters -->
  <div class="row mb-3">
    <div class="col-md-6">
      <label class="small">Search products</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="currentSearch"
        (input)="onSearchChange()"
        placeholder="Search products..."
      />
    </div>

    <div class="col-md-6">
      <label class="small">Category</label>
      <select
        class="form-select"
        [(ngModel)]="currentCategoryId"
        (change)="onCategoryChange()"
      >
        <option value="">All categories</option>
        <option *ngFor="let c of categories" [value]="c.id">
          {{ c.name }}
        </option>
      </select>
    </div>
  </div>

  <!-- Products -->
  <div class="row">
    <div
      class="col-12 col-sm-6 col-md-4 col-lg-3"
      *ngFor="let p of products"
    >
      <div class="card">
        <img
          [src]="'http://localhost:5000' + p.imagePath"
          class="card-img-top"
        />

        <div class="card-body d-flex flex-column">
          <h5>{{ p.name }}</h5>

          <div *ngIf="p.discountedPrice; else normalPrice">
            <div class="text-danger fw-bold">
              {{ p.discountedPrice | currency }}
            </div>
            <div class="text-muted text-decoration-line-through">
              {{ p.price | currency }}
            </div>
          </div>

          <ng-template #normalPrice>
            {{ p.price | currency }}
          </ng-template>

          <button mat-flat-button class="tertiary">
            Add to Cart
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <div class="text-center mt-3">
    <button (click)="prevPage()" [disabled]="currentPage === 1" mat-button class="secondary">
      Previous
    </button>

    <span>Page {{ currentPage }} / {{ totalPages }}</span>

    <button (click)="nextPage()" [disabled]="currentPage === totalPages" mat-button class="error">
      Next
    </button>
  </div>
</div>
