<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="header"></div>

    <div class="app-banner">
        <div class="container">
            <strong>Admin mode</strong> — You are currently managing the store
        </div>
    </div>

    <main class="main-content my-5">
        <div id="product-detail" class="row justify-content-center">
            <div class="col-12 col-md-6">
                <h1 class="text-center mb-4">Edit Category</h1>

                <form id="editCategoryForm">
                    <div class="mb-3">
                        <label class="form-label">Category name</label>
                        <input id="categoryName" type="text" class="form-control" required>
                        <div id="categoryNameError" class="text-danger mt-1"></div>
                    </div>

                    <div class="d-flex justify-content-center gap-2">
                        <button type="submit" class="btn btn-orange">Save changes</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <!-- Scripts -->
    <script src="js/layout.js"></script>
    <script src="js/admin-category-edit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
