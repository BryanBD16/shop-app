<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="header"></div>

    <div class="app-banner">
        <div class="container">
            <strong>Admin mode</strong> — You are currently managing the store
        </div>
    </div>

    <main class="main-content my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6">
                <h1 class="text-center mb-4">Create Discount</h1>

                <form id="createDiscountForm">
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input id="discountTitle" type="text" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Percentage</label>
                        <input id="discountPercentage" type="number" min="0" max="100" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Start date</label>
                        <input id="discountStartDate" type="datetime-local" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">End date</label>
                        <input id="discountEndDate" type="datetime-local" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Target type</label>
                        <select id="discountTargetType" class="form-select">
                            <option value="product">Product</option>
                            <option value="category">Category</option>
                        </select>
                    </div>

                    <div class="mb-3" id="productField">
                        <label class="form-label">Product</label>
                        <select id="discountProductId" class="form-select">
                            <option value="">Select a product</option>
                        </select>
                    </div>

                    <div class="mb-3 d-none" id="categoryField">
                        <label class="form-label">Category</label>
                        <select id="discountCategoryId" class="form-select">
                            <option value="">Select a category</option>
                        </select>
                    </div>

                    <div id="discountError" class="text-danger mt-1 mb-3"></div>

                    <div class="d-flex justify-content-center gap-2">
                        <button type="submit" class="btn btn-orange">Create</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <script src="js/layout.js"></script>
    <script src="js/admin-discount-create.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
